<style>
@property --hue{syntax:'<number>';inherits:true;initial-value:215}
*{box-sizing:border-box;margin:0}
:root{--hue:215;--bs:.15;--as:35%;--sp:25;transition:--hue .8s ease}
html[data-mode=dark]{color-scheme:dark;--bg:hsl(var(--hue) calc(30%*var(--bs)) 7%);--bg2:hsl(var(--hue) calc(24%*var(--bs)) 12%);--bg3:hsl(var(--hue) calc(20%*var(--bs)) 18%);--ink:hsl(var(--hue) calc(30%*var(--bs)) 95%);--mut:hsl(var(--hue) calc(16%*var(--bs)) 66%);--line:hsl(var(--hue) 30% 80%/.14);--acc:hsl(var(--hue) var(--as) 67%);--on:hsl(var(--hue) 50% 8%);--acc2:hsl(calc(var(--hue) + var(--sp)) var(--as) 62%);--glow:hsl(var(--hue) var(--as) 60%/.28);--done:hsl(148 55% 52%);--bad:#ef7a96;--warn:#e3b86f;--shade:rgba(0,0,0,.55)}
html[data-mode=light]{color-scheme:light;--bg:hsl(var(--hue) calc(60%*var(--bs)) 96%);--bg2:#fff;--bg3:hsl(var(--hue) calc(50%*var(--bs)) 92%);--ink:hsl(var(--hue) calc(45%*var(--bs)) 14%);--mut:hsl(var(--hue) calc(20%*var(--bs)) 38%);--line:hsl(var(--hue) 40% 30%/.15);--acc:hsl(var(--hue) calc(var(--as)*.9) 44%);--on:#fff;--acc2:hsl(calc(var(--hue) + var(--sp)) calc(var(--as)*.9) 40%);--glow:hsl(var(--hue) var(--as) 50%/.2);--done:hsl(148 55% 36%);--bad:#c4374a;--warn:#946409;--shade:rgba(20,22,25,.4)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.2;animation:orb 26s ease-in-out infinite alternate}
.orb:nth-child(odd){background:var(--acc)}.orb:nth-child(even){background:var(--acc2)}
@keyframes orb{to{transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.side{position:fixed;top:18px;left:18px;bottom:18px;width:212px;padding:16px 10px;display:flex;flex-direction:column;gap:3px;border-radius:20px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 74%,transparent);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;padding:4px 8px 14px}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--acc),var(--acc2),var(--acc));position:relative;animation:spin 8s linear infinite;flex:none}
.logo i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg2)}
@keyframes spin{to{transform:rotate(360deg)}}
.nb{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--mut);width:100%;text-align:left;font-size:14px}
.nb:hover{color:var(--ink)}.nb.on{background:var(--bg3);color:var(--ink)}
.sp{flex:1}#syncst{font-size:12px;color:var(--mut);padding:6px 12px}
main{position:relative;z-index:1;padding:24px 28px 110px 262px;width:100%;max-width:none}
h2{font-size:24px;font-weight:700;margin-bottom:18px;letter-spacing:-.01em}
h3.s{font-size:12px;color:var(--mut);font-weight:600;margin:22px 0 8px}
.view{display:none}.view.on{display:block}
.card{background:color-mix(in srgb,var(--bg2) 90%,transparent);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid .card{margin:0}
.num{font-size:28px;font-weight:800}.lbl{font-size:12px;color:var(--mut)}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);font-size:14px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--mut)}.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border:0;font-weight:600}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg3)}
input[type=color]{padding:2px;height:40px;width:56px}input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--mut);font-size:13px}
.chip:hover{color:var(--ink)}.chip.on{background:var(--glow);color:var(--ink);border-color:var(--acc)}.chip .x{margin-left:6px;opacity:.6;cursor:pointer}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.task:hover{border-color:var(--mut)}.task.done .ti{text-decoration:line-through;color:var(--mut)}
.cb{width:21px;height:21px;border-radius:7px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;background:none;padding:0;color:var(--on)}
.task.done .cb{background:var(--done);border-color:var(--done)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bd{flex:1;min-width:0}.ti{font-weight:600;word-break:break-word}
.m{font-size:12.5px;color:var(--mut)}.late{color:var(--bad)}.soon{color:var(--warn)}
.ib{border:0;background:none;color:var(--mut);padding:6px;border-radius:8px;display:flex}.ib:hover{color:var(--ink);background:var(--bg3)}.ib.bad:hover{color:var(--bad)}
.tt{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px}
.col.today{border-color:var(--acc)}.col b{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.cls{border-left:3px solid;background:var(--glow);border-radius:7px;padding:5px 7px;font-size:12px;margin-bottom:5px;cursor:pointer;word-break:break-word}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:26px 0}
.fab{position:fixed;bottom:26px;right:26px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px var(--glow);z-index:40}
.fab svg{width:24px;height:24px;stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 16px;border:0;background:none;color:var(--mut)}.seg button.on{background:var(--bg3);color:var(--ink)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}.sw.on{border-color:var(--ink)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.li.f{border-top:0}.li .nm{flex:1}
pre{background:var(--bg3);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;overflow:auto;margin:8px 0}
.next{display:flex;align-items:center;gap:14px}.next .big2{font-size:20px;font-weight:700}
/* popups */
.ov{position:fixed;inset:0;background:var(--shade);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.dlg{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:pop .2s ease-out}
.dlg.wide{max-width:640px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes up{from{transform:translateY(100%)}}
.dh{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 6px}.dh h3{flex:1;font-size:17px;font-weight:700}
.dh .sub{font-size:12px;color:var(--mut);display:block;font-weight:400}
.db{padding:6px 20px 10px}
.ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;position:sticky;bottom:0;background:var(--bg2);flex-wrap:wrap}
.dots{display:flex;gap:6px;padding:4px 20px 8px}.dots button{height:4px;flex:1;border-radius:2px;border:0;background:var(--bg3);padding:0}.dots button.on{background:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;text-align:center}.cal span{font-size:11px;color:var(--mut);padding:4px 0}
.dy{height:38px;border-radius:10px;border:1px solid transparent;background:none}.dy:hover{background:var(--bg3)}.dy.td{border-color:var(--mut)}.dy.on{background:var(--acc);color:var(--on);font-weight:700}
.ch{display:flex;gap:6px;align-items:center}.ch select{flex:1}
.big{display:flex;flex-wrap:wrap;gap:8px}.big button{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:none;font-size:14px}.big button:hover{border-color:var(--mut)}.big button.on{background:var(--glow);border-color:var(--acc)}
.prev{width:100%;max-height:230px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:var(--bg3);cursor:zoom-in}
.ir{display:grid;grid-template-columns:1.3fr .8fr 1.6fr 1.6fr 1fr auto;gap:6px;margin-bottom:8px;align-items:center}
.ir input,.ir select{padding:8px}
#alerts{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;left:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:70;pointer-events:none}
.al{pointer-events:auto;width:min(380px,100%);background:var(--bg2);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;display:flex;gap:10px;box-shadow:0 12px 30px var(--glow);animation:pop .2s}
.al b{display:block}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:60;max-width:90vw;font-size:14px}
.bn{display:none}
@media(max-width:760px){
 .side{display:none}
 main{padding:max(16px,env(safe-area-inset-top)) 14px 120px}
 .fab{bottom:calc(76px + env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%)}
 
 .bn{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
 .bn button{flex:1;background:none;border:0;color:var(--mut);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.bn button.on{color:var(--acc)}
 .ov{align-items:flex-end;padding:0}
 .dlg,.dlg.wide{max-width:none;border-radius:22px 22px 0 0;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom)}
 .dlg::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
 .ir{grid-template-columns:1fr 1fr;padding-bottom:8px;border-bottom:1px solid var(--line)}.ir>:first-child{grid-column:1/3}
}
@media(prefers-reduced-motion:reduce){.orb,.logo i,.dlg{animation:none}}

/* AXX theme: flat, sleek, tactile buttons */
#bg{display:none}
@media(min-width:761px){
 .side{top:0;left:0;bottom:0;width:218px;border-radius:0;border:0;border-right:1px solid var(--line);background:var(--bg);backdrop-filter:none;box-shadow:none;padding:20px 12px}
 main{padding:28px 36px 110px 254px}
}
/* desktop full-width layouts */
.tg{display:grid;grid-template-columns:1fr;gap:8px}.tg .task{margin-bottom:0}
.sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mut);margin:22px 0 10px}
.sec:first-child{margin-top:0}.sec .cnt{font-weight:600;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--bg3)}
.sec.dn{margin-top:30px}
.task.done{opacity:.55;filter:grayscale(.85)}.task.done:hover{opacity:.85}
.dg{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.pn{margin:0;padding:18px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph h3{flex:1;font-size:15px;font-weight:700}
.ph .cnt{font-size:12px;color:var(--mut)}
.pn .task{background:var(--bg3)}
.pn .cls{background:var(--bg3);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:8px}
.pn .next{padding:2px 0}
.sc{padding:18px 18px 16px;border-top:3px solid var(--acc)}
.sc.c-pending{border-top-color:var(--warn)}.sc.c-over{border-top-color:var(--bad)}.sc.c-done{border-top-color:var(--done)}
.sc.c-over .num{color:var(--bad)}.sc.c-done .num{color:var(--done)}.sc.c-pending .num{color:var(--warn)}
@media(min-width:761px){
 #stats{grid-template-columns:repeat(4,1fr);gap:16px}
 .num{font-size:34px}
}
@media(min-width:980px){
 .dg{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"next tasks" "cls tasks" "ds tasks";align-items:start}
 #p-next{grid-area:next}#p-cls{grid-area:cls}#p-ds{grid-area:ds}#p-tasks{grid-area:tasks}
}
@media(min-width:1100px){.tg{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px}}
/* urgency colours + breathing glow */
.u-red{--uc:#ff3b4e}.u-pink{--uc:#d6336c}.u-yel{--uc:#d9a400}.u-grn{--uc:#2fb36a}
@keyframes breathe{0%,100%{box-shadow:0 0 4px -1px color-mix(in srgb,var(--uc) 35%,transparent);border-color:color-mix(in srgb,var(--uc) 55%,var(--line))}50%{box-shadow:0 0 20px 1px color-mix(in srgb,var(--uc) 70%,transparent);border-color:var(--uc)}}
.task.u-red,.task.u-pink,.task.u-yel,.task.u-grn{border-width:1.5px;animation:breathe 3.6s ease-in-out infinite}
.task.u-red{animation-duration:1.7s}.task.u-pink{animation-duration:2.8s}
@media(prefers-reduced-motion:reduce){.task.u-red,.task.u-pink,.task.u-yel,.task.u-grn{animation:none;border-color:var(--uc);box-shadow:0 0 10px -2px var(--uc)}}
/* task card layout */
.tr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr1 .ti{flex:0 1 auto}
.sj{font-size:12px;color:var(--mut);padding:2px 9px;border:1px solid var(--line);border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.sj .dot{width:8px;height:8px}
.dd{font-size:12px;font-weight:600;color:var(--mut)}
.tr2{display:flex;gap:6px;margin-top:3px;min-width:0}.tm{flex:none}
.nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* detail popup */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;border:1px solid var(--uc);color:var(--uc)}
.dr{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.dnote{margin-top:12px;padding:12px;background:var(--bg3);border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:48px}
/* fixed-size wizard popup */
.dlg.fix{display:flex;flex-direction:column;height:min(650px,92vh)}.dlg.fix>.db{flex:1;overflow:auto}
/* search bar */
.sbar{max-height:0;opacity:0;overflow:hidden;transform:translateY(-6px);transition:max-height .25s,opacity .2s,transform .25s,margin .25s}
.sbar.open{max-height:64px;opacity:1;transform:none;margin-bottom:12px}
.fbadge{background:var(--acc);color:var(--on);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;margin-left:2px}
.card,.side{backdrop-filter:none}.card{background:var(--bg2)}
.logo i{width:18px;height:18px;background:none;border:2px solid var(--acc);animation:none;position:relative}
.logo i::after{inset:auto;top:-4px;left:4px;width:5px;height:5px;background:var(--acc);position:absolute;border-radius:50%}
.btn,.chip,.big button,.dy,.nb,.bn button,.ib,.seg button,.cb,.sc{position:relative;overflow:hidden;transition:transform .14s,box-shadow .2s,background .2s,border-color .2s,color .2s,filter .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px var(--glow);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.1)}
.btn:active,.chip:active,.big button:active,.dy:active,.ib:active,.fab:active,.cb:active,.sc:active{transform:scale(.94)}
.chip:hover{border-color:var(--acc);color:var(--ink)}.fab{transition:transform .15s,box-shadow .2s}.fab:hover{box-shadow:0 14px 30px var(--glow)}
.ib:hover{background:var(--bg3)}.nb{transition:background .2s,color .2s}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .5s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@media(max-width:760px){.fab:active{transform:translateX(-50%) scale(.94)}}
button.card{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.sc .go{position:absolute;right:12px;top:14px;color:var(--mut)}.sc:hover{border-color:var(--acc);transform:translateY(-2px)}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:none}.btn.d{background:none;color:var(--bad)}
.acts{display:flex;align-items:center;gap:2px;flex:none}

.sd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:7px}.sd.ok{background:var(--done)}
.row>input:not([type=color]):not([type=checkbox]){flex:1}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}input[type=checkbox]{accent-color:var(--acc)}
.scx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.scx .chip{white-space:nowrap}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;padding:20px;display:none}

/* ===== PHASE 1: scrollbars, alerts, dropdowns, time picker ===== */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--acc) 40%,transparent);border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--acc);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--acc) 55%,transparent) transparent}}
textarea{resize:vertical}
/* alert cards (3 sec) */
.al{position:relative;overflow:hidden;align-items:center;border-radius:16px;padding:13px 14px 16px;border:1px solid color-mix(in srgb,var(--ac,var(--acc)) 55%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--ac,var(--acc)) 14%,var(--bg2)),var(--bg2));box-shadow:0 14px 34px color-mix(in srgb,var(--ac,var(--acc)) 30%,transparent);animation:alin .3s cubic-bezier(.2,.9,.3,1.2)}
.al.ok{--ac:var(--done)}
.al .ai{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ac,var(--acc)) 22%,transparent);color:var(--ac,var(--acc));flex:none}
.al .ai svg{width:20px;height:20px}
.al.ok .ai svg{animation:tick .45s .1s cubic-bezier(.2,1.5,.4,1) backwards}

const aiOK=()=>GROQ_API_KEY.length>20&&!/PASTE/.test(GROQ_API_KEY);
const GROQ_DEF="qwen/qwen3.8-27b",GROQ_ALT=["qwen/qwen3.8-27b","qwen/qwen3.6-27b","meta-llama/llama-4-scout-17b-16e-instruct"];
const gModel=()=>{const m=load("up_model","");return m&&!/^claude|scout/i.test(m)?m:GROQ_DEF};
const jsonArr=t=>{t=String(t||"").replace(/<think>[\s\S]*?<\/think>/gi,"");const e=t.lastIndexOf("]");if(e<0)return null;let i=-1;while((i=t.indexOf("[",i+1))>=0&&i<e){try{const v=JSON.parse(t.slice(i,e+1));if(Array.isArray(v))return v}catch{}}return null};
function tm24(v,fb){const m=String(v==null?"":v).trim().toUpperCase().match(/(\d{1,2})(?:[:.](\d{2}))?\s*(AM|PM|A|P)?/);if(!m)return fb;let h=+m[1],mi=Math.min(59,+(m[2]||0));const ap=m[3];if(ap){if(ap[0]==="P"&&h<12)h+=12;if(ap[0]==="A"&&h===12)h=0}h=h%24;return pad(h)+":"+pad(mi)}
async function groqCall(key,model,b64,prompt=AIP){
 const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,temperature:0,max_tokens:6000,messages:[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}}]}]})});
 const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error?.message||"Groq request failed ("+r.status+")");e.nf=/does not exist|do not have access|decommission|not found|no longer/i.test(e.message);throw e}
 return j}
async function aiRead(img=imp.img,prompt=AIP,map=ttMap){
 if(!aiOK())throw new Error("AI reading is not set up");
 const b64=img.split(",")[1],key=GROQ_API_KEY;let j=null;
 const tried=[...new Set([gModel(),...GROQ_ALT])];let last=null;
 for(const m of tried){try{j=await groqCall(key,m,b64,prompt);if(m!==load("up_model",""))put("up_model",m);break}catch(e){last=e;if(!e.nf)throw e}}
 if(!j)throw last||new Error("No Groq vision model available");
 if(j.error)throw new Error(j.error.message||"AI error");
 const txt=j.choices?.[0]?.message?.content||"";
 const arr=jsonArr(txt);if(!arr)throw new Error("Could not read any data from this picture");
 return map(arr)
}

}
async function runCAI(){
 const C=cimp;if(!C||C.busy)return;const todo=C.imgs.filter(x=>!x.done);if(!todo.length)return;
 C.busy=true;C.msg="";drawCimp();
 for(const im of todo){
  try{const r=await aiRead(im.src,clsPrompt(),clsMap);if(cimp!==C)return;im.done=true;
   r.forEach(x=>{if(!C.rows.some(y=>y.title.trim().toLowerCase()===x.title.toLowerCase()&&y.date===x.date&&y.course.toLowerCase()===x.course.toLowerCase()))C.rows.push(x)})}
  catch(e){if(cimp!==C)return;C.msg="AI error: "+e.message;break}
 }
 if(cimp!==C)return;C.busy=false;
 if(!C.msg&&!C.rows.length)C.msg="No tasks found. Try a clearer screenshot or add them manually.";
 drawCimp();
}
function cimpSave(){
 const C=cimp,rows=C.rows.filter(r=>r.title.trim());if(!rows.length)return toast("Add at least one task");
 let n=0,sk=0;
 rows.forEach(r=>{
  if(isDup(r)){sk++;return}
  let sid=clsSubj(r.course);if(sid===null)sid=mk("subject",{name:r.course.trim(),color:nextColor(),kind:"theory"});
  mk("task",{title:r.title.trim(),type:r.type||types()[0],subject:sid,due:clsDue(r),notes:(r.notes||"").trim(),done:!!r.done,doneAt:r.done?Date.now():null,trashed:false,src:"classroom"});n++});
 if(!n)return toast("All of these tasks already exist");
 persist();render();push();toast(n+" task"+(n>1?"s":"")+" added"+(sk?" ("+sk+" already existed)":""));closeD();
}
document.addEventListener("click",e=>{
 const bid=e.target.closest("button")?.id;
 if(bid==="tcls"){cimpOpen();return}
 if(!cimp)return;
 const rm=e.target.closest("[data-cr-rm]");
 if(rm){cimp.rows.splice(+rm.dataset.crRm,1);drawCimp();return}
 if(bid==="cl-b"){$("#cl-f").click();return}
 if(bid==="cl-ai"){runCAI();return}
 if(bid==="cl-add"){cimp.rows.push(cblank());drawCimp();return}
 if(bid==="cl-save"){cimpSave();return}
});
document.addEventListener("change",e=>{
 const t=e.target;if(!cimp)return;
 if(t.id==="cl-f"&&t.files.length){cimpAdd([...t.files]);t.value="";return}
 const r=t.dataset.crf&&cimp.rows[+t.dataset.cri];
 if(r){r[t.dataset.crf]=t.dataset.tp?t12v(t):t.type==="checkbox"?t.checked:t.value;cimpRefresh()}
});
document.addEventListener("input",e=>{
 const t=e.target;if(!cimp||t.dataset.tp)return;
 const r=t.dataset.crf&&cimp.rows[+t.dataset.cri];
 if(r&&t.type!=="checkbox"&&t.tagName!=="SELECT"){r[t.dataset.crf]=t.value;cimpRefresh()}
});
document.addEventListener("paste",e=>{
 if(!cimp)return;const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
 if(fs.length){e.preventDefault();cimpAdd(fs)}
});

/* ===== THEME & BOOT ===== */
function theme(){const h=HUES[load("up_hue",0)]||HUES[0],r=document.documentElement;r.dataset.mode=load("up_mode","dark");r.style.setProperty("--hue",h[1]);r.style.setProperty("--bs",h[2]);r.style.setProperty("--as",h[3]);r.style.setProperty("--sp",h[4])}
const navHTML=(ks,c)=>ks.map(k=>`<button class="${c}" data-v="${k}">${ic(VIEWS[k][1])}${c==="nb"?VIEWS[k][0]:`<span>${VIEWS[k][0]}</span>`}</button>`).join("");
$("#nav").innerHTML=navHTML(["dashboard","tasks","timetable","datesheet","calendar","history","archive"],"nb");$("#nav2").innerHTML=navHTML(["settings"],"nb");
$("#bn").innerHTML=navHTML(Object.keys(VIEWS).filter(k=>k!=="archive"),"");$("#fab").innerHTML=ic("plus");$("#refbtn").innerHTML=ic("refresh")+'<span class="bl">Refresh</span>';
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b||b.disabled||b.classList.contains("sw")||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,x=document.createElement("span");x.className="rip";x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),520)});
async function lockTry(){
 const p=$("#lpin").value;if(!p)return;
 if(!sb){$("#lmsg").textContent="Not connected yet. Please wait a moment.";return}
 const b=$("#lgo");b.disabled=true;b.textContent="Signing in...";
 const{error}=await sb.auth.signInWithPassword({email:APP_EMAIL,password:p});
 b.disabled=false;b.textContent="Sign in";
 if(error){$("#lmsg").textContent=/invalid/i.test(error.message)?"Wrong password. Please try again.":error.message;$("#lpin").value="";$("#lpin").focus()}
}
theme();render();initSB();remind();let lastDay=ymd(new Date());setInterval(()=>{const n=ymd(new Date());if(n!==lastDay){lastDay=n;render()}else if(view!=="settings")render()},3e4);
</script>
